<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gym Tracker</title>
  <meta name="description" content="Registra tus entrenamientos de gimnasio: ejercicios, series, peso, repeticiones e historial de progreso." />
  <meta name="theme-color" content="#11141a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Gym Tracker" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <div id="offline-banner" class="offline-banner">Sin conexión — los datos se guardan en el dispositivo</div>
    <header class="topbar">
      <h1 id="view-title">Registrar</h1>
    </header>
    <main id="view-root" class="view-root"></main>
    <nav class="bottom-nav" id="bottom-nav">
      <button data-view="log"><span class="icon">🏋️</span><span>Registrar</span></button>
      <button data-view="history"><span class="icon">📋</span><span>Historial</span></button>
      <button data-view="progress"><span class="icon">📈</span><span>Progreso</span></button>
      <button data-view="routines"><span class="icon">📝</span><span>Rutinas</span></button>
      <button data-view="settings"><span class="icon">⚙️</span><span>Ajustes</span></button>
    </nav>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
